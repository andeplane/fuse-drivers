<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#1a1208" />
<title>Fuse Drivers controller</title>
<style>
html,body{margin:0;height:100%;background:#1a1208;color:#fff;font:bold 18px monospace;overflow:hidden;overscroll-behavior:none;touch-action:none;-webkit-user-select:none;user-select:none}
body::before{content:'';position:fixed;inset:0;background:url(/assets/grandstand.png) 0 0/384px auto repeat;opacity:.28;pointer-events:none}
.logo{height:min(34vh,280px);aspect-ratio:1;object-fit:cover;object-position:0 50%;filter:drop-shadow(4px 4px 0 #000)} /* logo.png is a two-frame strip; show the first */
#top{position:fixed;top:0;left:0;right:0;padding:8px 14px;display:flex;justify-content:space-between;align-items:center;z-index:20;pointer-events:none}
#badge{padding:6px 14px;border:3px solid #000;border-radius:10px;color:#000;font:900 20px Impact,'Arial Black',monospace;box-shadow:0 4px 0 #000;pointer-events:none}
#status{text-shadow:2px 2px 0 #000;color:#ffd23f}
.screen{position:fixed;inset:44px 16px 12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:min(14px,2vh);text-align:center;touch-action:auto;overflow:auto}
.screen p{margin:0}
@media (max-height:480px){input,button.big{font-size:24px;padding:8px 18px}}
.screen[hidden]{display:none}
input,button.big{font:900 30px Impact,'Arial Black',monospace;padding:12px 22px;border:4px solid #000;border-radius:14px;box-shadow:0 6px 0 #000}
input{width:6em;text-align:center;text-transform:uppercase}
button.big{background:linear-gradient(#ffe87a,#f0b400);color:#000}
button.big:active{transform:translateY(4px);box-shadow:0 2px 0 #000}
.screen p{text-shadow:2px 2px 0 #000;font-size:20px}
#shop{justify-content:flex-start}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between;width:min(560px,100%);background:#2a2018;border:3px solid #000;border-radius:12px;padding:8px 12px;box-sizing:border-box}
.row button{font:bold 20px monospace;padding:8px 12px;border:3px solid #000;border-radius:10px;background:#9cff2e}
.row button:disabled{background:#555;color:#999}
h1{margin:0;font:900 40px Impact,'Arial Black',monospace;color:#ffe600;text-shadow:3px 3px 0 #e01010,6px 6px 0 #000}
</style>
</head>
<body>
<div id="top"><span id="badge" hidden></span><span id="status"></span></div>
<div id="join" class="screen" hidden>
  <img class="logo" src="/assets/logo.png" alt="Fuse Drivers" />
  <p>Enter the room code shown on the TV</p>
  <input id="code" maxlength="4" autocomplete="off" autocapitalize="characters" />
  <button id="go" class="big">JOIN</button>
</div>
<div id="wait" class="screen" hidden><h1 id="waitTitle">YOU'RE IN</h1><p id="waitText">Watch the TV.</p></div>
<div id="shop" class="screen" hidden></div>
<script type="module" src="/src/pad/main.ts"></script>
</body>
</html>
