<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#1a1208" />
<title>Fuse Drivers controller</title>
<style>
html,body{margin:0;height:100%;background:#1a1208;color:#fff;font:bold 18px monospace;overflow:hidden;overscroll-behavior:none;touch-action:none;-webkit-user-select:none;user-select:none}
#top{position:fixed;top:0;left:0;right:0;padding:8px 14px;display:flex;justify-content:space-between;align-items:center;z-index:20;pointer-events:none}
#badge{padding:4px 12px;border:3px solid #000;border-radius:10px;color:#000}
.screen{position:fixed;inset:48px 16px 16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;touch-action:auto;overflow:auto}
.screen[hidden]{display:none}
input,button.big{font:bold 28px monospace;padding:12px 18px;border:4px solid #000;border-radius:14px}
input{width:6em;text-align:center;text-transform:uppercase}
button.big{background:#ffd23f;color:#000}
#shop{justify-content:flex-start}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between;width:min(560px,100%);background:#2a2018;border:3px solid #000;border-radius:12px;padding:8px 12px;box-sizing:border-box}
.row button{font:bold 20px monospace;padding:8px 12px;border:3px solid #000;border-radius:10px;background:#9cff2e}
.row button:disabled{background:#555;color:#999}
h1{margin:0;font-size:32px;color:#ffd23f}
</style>
</head>
<body>
<div id="top"><span id="badge" hidden></span><span id="status"></span></div>
<div id="join" class="screen" hidden>
  <h1>FUSE DRIVERS</h1>
  <p>Enter the room code shown on the TV</p>
  <input id="code" maxlength="4" autocomplete="off" autocapitalize="characters" />
  <button id="go" class="big">JOIN</button>
</div>
<div id="wait" class="screen" hidden><h1 id="waitTitle">YOU'RE IN</h1><p id="waitText">Watch the TV.</p></div>
<div id="shop" class="screen" hidden></div>
<script type="module" src="/src/pad/main.ts"></script>
</body>
</html>
